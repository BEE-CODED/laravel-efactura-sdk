name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # composer.json allows illuminate ^11|^12|^13 but only one is ever installed
    # locally, so the matrix is the only thing that checks the range we advertise.
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['11.*', '12.*', '13.*']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          # Laravel 13 is tested prefer-stable only: prefer-lowest would pull test
          # deps (pest 3.0 / phpunit 11) that predate Laravel 13 and cannot resolve.
          - laravel: '13.*'
            dependency-version: prefer-lowest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, simplexml
          coverage: none

      - name: Install dependencies
        run: |
          # Composer 2.8+ refuses to install security-advisory-flagged releases, and
          # every laravel/framework 11.x that testbench 9.x needs currently carries one.
          # We still support Laravel 11, so unblock it for CI only (never shipped).
          composer config --global policy.advisories.block false
          composer require "illuminate/support:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Tests
        run: vendor/bin/pest

  static-analysis:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, simplexml
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      # No baseline, no ignores — a suppression is how the message-sync bug
      # stayed hidden. Keep this honest.
      - run: vendor/bin/phpstan analyse --no-progress

  code-style:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/pint --test

  mcp:
    name: MCP server (docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
        working-directory: mcp
      - run: npx vitest run
        working-directory: mcp
      # dist/index.js is committed and shipped to consumers. If it drifts from
      # src/, users get documentation that does not match this release.
      - name: Verify committed bundle matches src
        working-directory: mcp
        run: |
          npm run build
          if ! git diff --quiet -- dist/; then
            echo "::error::mcp/dist is stale — run 'npm run build' in mcp/ and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
